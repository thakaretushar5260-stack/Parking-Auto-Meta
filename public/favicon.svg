<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#redGrad)" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Stylized Letter P -->
  <path d="M 22 48 L 22 16 L 35 16 C 42 16 46 20 46 26 C 46 32 42 36 35 36 L 29 36 L 29 48 Z M 29 22 L 29 30 L 34.5 30 C 37.5 30 39.5 28.5 39.5 26 C 39.5 23.5 37.5 22 34.5 22 Z" fill="#ffffff" filter="url(#glow)" />
  
  <!-- RFID WiFi / Radar Waves -->
  <path d="M 44 14 C 48 18 48 24 44 28" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 49 10 C 55 16 55 26 49 32" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
</svg>
